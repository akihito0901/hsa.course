<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン｜ホームサクセスアカデミー</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;color:#1a1a2e;background:linear-gradient(160deg,#f3f0ff,#e0f2fe);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
:root{--pur:#7c3aed;--ga:linear-gradient(135deg,#7c3aed,#3b82f6);--line:#e5e7eb;--muted:#6b7280}
.card{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:38px 30px;box-shadow:0 24px 60px rgba(124,58,237,.18)}
.logo{display:flex;justify-content:center;margin-bottom:18px}
.logo img{height:40px}
h1{font-size:1.35rem;font-weight:900;text-align:center;margin-bottom:6px}
.sub{font-size:.85rem;color:var(--muted);text-align:center;margin-bottom:26px}
.tabs{display:flex;background:#f3f0ff;border-radius:999px;padding:4px;margin-bottom:22px}
.tab{flex:1;text-align:center;font-size:.85rem;font-weight:800;padding:10px;border-radius:999px;border:none;background:transparent;color:var(--muted);cursor:pointer}
.tab.active{background:#fff;color:var(--pur);box-shadow:0 2px 10px rgba(124,58,237,.12)}
label{display:block;font-size:.78rem;font-weight:800;color:#555;margin:0 0 7px 2px}
input{width:100%;font-size:1rem;padding:14px 16px;border:2px solid var(--line);border-radius:14px;margin-bottom:16px;font-family:inherit}
input:focus{outline:none;border-color:var(--pur)}
.btn{width:100%;font-size:.95rem;font-weight:800;padding:15px;border-radius:999px;border:none;color:#fff;background:var(--ga);cursor:pointer;transition:filter .2s}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.6;cursor:default}
.or{display:flex;align-items:center;gap:12px;color:#bbb;font-size:.75rem;font-weight:700;margin:20px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.btn-google{width:100%;font-size:.9rem;font-weight:800;padding:14px;border-radius:999px;border:2px solid var(--line);background:#fff;color:#333;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-google:hover{background:#faf9ff}
.g-ic{width:18px;height:18px;flex-shrink:0}
.msg{font-size:.82rem;text-align:center;margin-top:16px;min-height:1.2em;line-height:1.6}
.msg.err{color:#dc2626}
.msg.ok{color:#059669}
.foot{text-align:center;font-size:.78rem;color:#bbb;margin-top:22px}
.foot a{color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="images/logo.png" alt="Home Success Academy"></div>
  <h1 id="title">ログイン</h1>
  <p class="sub" id="subtitle">メールアドレスでログインしてください</p>

  <div class="tabs">
    <button class="tab active" data-mode="login" type="button">ログイン</button>
    <button class="tab" data-mode="signup" type="button">新規登録</button>
  </div>

  <form id="form">
    <label for="email">メールアドレス</label>
    <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <label for="password">パスワード</label>
    <input id="password" type="password" autocomplete="current-password" required placeholder="6文字以上">
    <button class="btn" id="submit" type="submit">ログイン</button>
  </form>

  <div class="or">または</div>
  <button class="btn-google" id="google" type="button">
    <svg class="g-ic" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Googleで続ける
  </button>

  <p class="msg" id="msg"></p>
  <p class="foot"><a href="index.html">← 教材一覧へ戻る</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script>
const sb = window.supabase.createClient(HSA_CONFIG.SUPABASE_URL, HSA_CONFIG.SUPABASE_ANON_KEY);
let mode = 'login';
const nextParam = new URLSearchParams(location.search).get('next') || 'index.html';
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submit');

function setMsg(text, kind){ msg.textContent = text; msg.className = 'msg ' + (kind||''); }
function go(){ location.href = nextParam; }

// すでにログイン済みなら飛ばす
sb.auth.getSession().then(({data})=>{ if(data.session) go(); });

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    mode = t.dataset.mode;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
    document.getElementById('title').textContent = mode==='login' ? 'ログイン' : '新規登録';
    document.getElementById('subtitle').textContent = mode==='login' ? 'メールアドレスでログインしてください' : 'メールアドレスとパスワードで登録します';
    submitBtn.textContent = mode==='login' ? 'ログイン' : '登録する';
    document.getElementById('password').autocomplete = mode==='login' ? 'current-password' : 'new-password';
    setMsg('');
  });
});

document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  submitBtn.disabled = true; setMsg('処理中…');
  try{
    if(mode==='login'){
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      go();
    }else{
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(data.session){ go(); }
      else { setMsg('確認メールを送りました。メール内のリンクを開いて登録を完了してください。','ok'); }
    }
  }catch(err){
    const m = (err && err.message) || 'エラーが発生しました';
    setMsg(m.includes('Invalid login') ? 'メールアドレスかパスワードが違います。' : m, 'err');
  }finally{
    submitBtn.disabled = false;
  }
});

document.getElementById('google').addEventListener('click', async ()=>{
  setMsg('Googleに移動します…');
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + '/' + nextParam }
  });
  if(error) setMsg(error.message, 'err');
});
</script>
</body>
</html>
